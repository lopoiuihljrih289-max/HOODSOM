<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOODSOM | Gang Check-in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #0f0f0f; color: #e5e5e5; background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%); min-height: 100vh; }
        .glass-panel { background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-rp { background-color: #0a0a0a; border: 1px solid #333; color: white; transition: all 0.3s ease; }
        .input-rp:focus { border-color: #d97706; outline: none; }
        .status-radio:checked + div { border-color: #d97706; background-color: rgba(217, 119, 6, 0.1); color: #fbbf24; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-8 pt-4">
            <h1 class="text-5xl md:text-7xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-600 uppercase">HOODSOM</h1>
            <p class="text-amber-500 tracking-widest text-sm md:text-base font-semibold mt-2">FAMILY & LOYALTY • CHECK-IN SYSTEM</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1">
                <div class="glass-panel rounded-xl p-6 sticky top-6">
                    <h2 class="text-xl font-bold mb-4 border-l-4 border-amber-600 pl-3">ลงชื่อเข้างาน</h2>
                    <form id="checkinForm" class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1 uppercase font-bold">วันที่ (Date)</label>
                            <input type="date" id="inputDate" class="input-rp w-full p-3 rounded-lg text-sm" required>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1 uppercase font-bold">ชื่อ IC (Name)</label>
                            <input type="text" id="inputName" placeholder="ระบุชื่อในเกม..." class="input-rp w-full p-3 rounded-lg text-sm" required>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-2 uppercase font-bold">สถานะ (Status)</label>
                            <div class="grid grid-cols-3 gap-2">
                                <label class="cursor-pointer">
                                    <input type="radio" name="status" value="present" class="status-radio hidden" checked>
                                    <div class="border border-gray-700 rounded-lg p-2 text-center hover:bg-gray-800 transition">
                                        <i class="fas fa-check-circle text-green-500 block text-lg mb-1"></i>
                                        <span class="text-xs font-bold">มา</span>
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="status" value="leave" class="status-radio hidden">
                                    <div class="border border-gray-700 rounded-lg p-2 text-center hover:bg-gray-800 transition">
                                        <i class="fas fa-file-alt text-yellow-500 block text-lg mb-1"></i>
                                        <span class="text-xs font-bold">ลา</span>
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="status" value="absent" class="status-radio hidden">
                                    <div class="border border-gray-700 rounded-lg p-2 text-center hover:bg-gray-800 transition">
                                        <i class="fas fa-times-circle text-red-500 block text-lg mb-1"></i>
                                        <span class="text-xs font-bold">ขาด</span>
                                    </div>
                                </label>
                            </div>
                            <div id="reasonDiv" style="display: none;" class="mt-3">
                                <label class="block text-xs text-yellow-500 mb-1 uppercase font-bold">เหตุผลการลา (Reason)</label>
                                <input type="text" id="inputReason" placeholder="เช่น ติดงาน / ไปตจว." class="input-rp w-full p-3 rounded-lg text-sm border-yellow-900/50">
                            </div>
                        </div>
                        <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-amber-700 to-amber-600 text-white font-bold py-3 rounded-lg shadow-lg">บันทึกและส่ง Discord</button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="glass-panel rounded-xl p-6 h-full flex flex-col">
                    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <h2 class="text-xl font-bold border-l-4 border-gray-500 pl-3">ประวัติในเครื่องคุณ</h2>
                        <input type="date" id="filterDate" class="input-rp p-2 rounded-lg text-sm">
                    </div>
                    <div class="overflow-x-auto flex-grow rounded-lg border border-gray-800">
                        <table class="w-full text-left">
                            <thead class="bg-black/50 text-gray-400 text-xs uppercase border-b border-gray-800">
                                <tr>
                                    <th class="p-4">เวลา</th>
                                    <th class="p-4">ชื่อ IC</th>
                                    <th class="p-4 text-center">สถานะ</th>
                                </tr>
                            </thead>
                            <tbody id="dataTableBody" class="text-sm divide-y divide-gray-800"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1460542819792977933/3aHjZG2lR3aYIBSog0purfBnaxI-FqARzRywZ5HfMl0ttHylyyArC0qJStF7uLuD7um0';
        const STORAGE_KEY = 'HOODSOM_DATA_V2';
        
        const form = document.getElementById('checkinForm');
        const reasonDiv = document.getElementById('reasonDiv');
        const inputReason = document.getElementById('inputReason');

        // ฟังก์ชันควบคุมการแสดงช่องเหตุผล
        document.querySelectorAll('input[name="status"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'leave') {
                    reasonDiv.style.display = 'block';
                } else {
                    reasonDiv.style.display = 'none';
                    inputReason.value = '';
                }
            });
        });

        function getData() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const name = document.getElementById('inputName').value.trim();
            const status = document.querySelector('input[name="status"]:checked').value;
            const reason = inputReason.value.trim();
            const date = document.getElementById('inputDate').value;
            const time = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

            // บันทึกในเครื่อง
            const data = getData();
            data.push({ id: Date.now(), name, date, status, reason, timestamp: time });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            renderTable();

            // ส่งไป Discord
            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังส่ง...';

            let statusText = status === 'present' ? '✅ มา' : (status === 'leave' ? '📝 ลา' : '❌ ขาด');
            
            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "📍 เช็คอินใหม่ - HOODSOM",
                            color: status === 'present' ? 5763719 : (status === 'leave' ? 16776960 : 15548997),
                            fields: [
                                { name: "ชื่อ IC", value: name, inline: true },
                                { name: "สถานะ", value: statusText, inline: true },
                                { name: "เหตุผล", value: reason || "-" }
                            ],
                            timestamp: new Date().toISOString()
                        }]
                    })
                });
                alert('บันทึกและแจ้ง Discord แล้ว!');
            } catch (err) { alert('ส่ง Discord ไม่สำเร็จ'); }

            form.reset();
            document.getElementById('inputDate').value = date;
            reasonDiv.style.display = 'none';
            submitBtn.disabled = false;
            submitBtn.innerText = 'บันทึกและส่ง Discord';
        });

        function renderTable() {
            const data = getData();
            const selectedDate = document.getElementById('filterDate').value;
            const filtered = data.filter(item => item.date === selectedDate).sort((a, b) => b.id - a.id);
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = filtered.length ? '' : '<tr><td colspan="3" class="p-8 text-center text-gray-600">ไม่มีข้อมูล</td></tr>';
            filtered.forEach(item => {
                const row = `<tr><td class="p-4 text-gray-500">${item.timestamp}</td><td class="p-4 font-semibold">${item.name}</td><td class="p-4 text-center">${item.status}</td></tr>`;
                tbody.innerHTML += row;
            });
        }

        document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('filterDate').value = document.getElementById('inputDate').value;
        document.getElementById('filterDate').addEventListener('change', renderTable);
        renderTable();
    </script>
</body>
</html>
